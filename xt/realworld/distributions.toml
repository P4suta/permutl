# Each table is one run of the tool on a real distribution, and the name of the table names the run.
# `mise run realworld` builds the image from these archives, runs every table inside it, and judges each record.
# `pathname` names the archive below https://cpan.metacpan.org/authors/id/, as cpanfile.snapshot does.
# `sha256` is the digest that the build of the image requires of the archive.
# `shape` says what the distribution brings that the others lack.
# `build` lists the commands that prepare an unpacked tree, each as a list of words.
# `hash_seed` selects a reproducible Perl hash traversal for the reference tests and the measured run.
# `tests` is the command that states the truth about the unmodified tests.
# `options` holds the options of `mutation run`, and `config` holds the text of a mutation.toml for the run.
# `expect.mutants` is the band of the number of mutants that the run announces.
# `expect.score` is the band of the score, and a run that gives no score leaves it out.
# `expect.verdicts` maps selected mutant IDs from the archive to their observed statuses.
# `expect.warnings` lists the diagnostic kinds accepted for the case.
# `expect.seconds` is the wall time that the run may take, which the gate reports and never judges.
# The count is exact, and the score interval encloses the measured fraction to one decimal place.

