[tools]
fd = "10.5.2"
gitleaks = "8.30.1"
perl = "5.44.0.0"

[env]
PERL5LIB = "{{config_root}}/local/lib/perl5"
_.path = ["{{config_root}}/local/bin"]

[vars]
# The list comes from Git and from the first line of each file, so the formatter reaches every Perl file of the project.
perl_files = "perl xt/bin/perl-files library program"

[tasks.setup]
description = "Install the dependencies recorded in cpanfile.snapshot"
# cpm reads cpanfile.snapshot through Carton::Snapshot, so a fresh checkout needs Carton before the first install.
run = [
  "test -x local/bin/cpm || cpanm --quiet --notest --reinstall -L local App::cpm",
  "test -x local/bin/carton || cpanm --quiet --notest --reinstall -L local Carton",
  "carton check",
  "cpm install -L local --top-level-phase configure,build,test,runtime,develop",
]

[tasks.lock]
description = "Rewrite cpanfile.snapshot from cpanfile"
run = "carton install"

[tasks.fmt]
description = "Format Perl files in place"
run = "perltidy --backup-and-modify-in-place --backup-file-extension=/ $({{vars.perl_files}})"

[tasks.style]
description = "Fail when a Perl file differs from its formatted form or breaks the lint"
# The gate formats and lints every Perl file itself, so the task and the fast gate share one implementation.
run = "prove -l xt/perl-files.t"

[tasks.test]
description = "Run the unit, assumption, and contract tests, and the fast subset of the mutant quality harness"
run = "prove -lr t/unit t/assumptions t/contract t/discovery"

[tasks.test-shim]
description = "Run the shim tests"
run = "prove -l t/shim"

[tasks.e2e]
description = "Run the end-to-end tests"
run = "prove -l t/e2e"

[tasks.gate]
description = "Run the structural gates over the library"
run = "prove -l xt"

[tasks.discover-fast]
description = "Compare runs of the engine with independent oracles, each axis value once"
# The files run side by side: each one works in scratch directories of its own.
run = "prove -l -j4 xt/discovery"

[tasks.discover]
description = "Compare runs of the engine with independent oracles over every seed and every product of the axes"
env = { DISCOVERY_TIER = "full" }
run = "prove -l -j4 xt/discovery"

[tasks.mutation]
description = "Measure the tests of Test::Mutation with its own command"
run = "perl -Ilib bin/mutation"

[tasks.benchmark-measurement]
description = "Measure cold and warm runs and five indexed lookups among 8,064 mutants on macOS"
run = "perl xt/bin/benchmark-measurement"

[tasks.manual]
description = "Generate the reference sections of the installed mutation command"
run = "perl xt/bin/generate-manual"

[tasks.schema]
description = "Fetch the report schema of the pinned viewer release"
run = "curl --fail --silent --show-error --location --output xt/schema/mutation-testing-report-schema.json https://raw.githubusercontent.com/stryker-mutator/mutation-testing-elements/v3.9.0/packages/report-schema/src/mutation-testing-report-schema.json"

[tasks.discover-mutants]
description = "Judge the mutants of every installed module and of every generated snippet with perl"
# The run takes minutes, so the fast gate holds its subset under t/discovery and the release gate holds this task.
run = "prove -l xt/mutants"

[tasks.mutation-gate]
description = "Measure Test::Mutation with itself and check the release conditions"
run = ['''
  reports=${TEST_MUTATION_DETECTOR_DIR:-}
  unset TEST_MUTATION_DETECTOR_DIR
  perl xt/bin/confirm-self-measurement ${reports:+"$reports"/*.json}
  ''', "prove -l xt/release", "mise run discover-mutants"]

[tasks.shim-mutation]
description = "Measure the installed shim with Perl 5.10, 5.14, and 5.18"
run = [
  "docker build --quiet --target shim --file xt/realworld/Dockerfile --tag test-mutation-shim-release .",
  "docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --cpus 2 --memory 1g --tmpfs /work:exec,size=512m,uid=1000,gid=1000,mode=0755 --tmpfs /tmp:exec,size=128m,mode=1777 --volume {{config_root}}:/repo:ro test-mutation-shim-release",
]

[tasks.release-gate]
description = "Verify the complete self measurement, coverage, discovery, and pinned distributions"
run = [
  "mise run check",
  "mise run mutation-gate",
  "mise run release-compatibility",
  "mise run dist",
  "make disttest",
  "mise run verify-install",
]

[tasks.record-release-check]
description = "Run the local release gate and record its result on the candidate commit"
run = "sh xt/bin/record-release-check"

[tasks.release-compatibility]
description = "Verify supported shim interpreters, coverage, engine behavior, and pinned distributions"
run = [
  "mise run check-ci-interpreters",
  "mise run shim-mutation",
  "mise run coverage",
  "mise run discover",
  "mise run realworld",
]

[tasks.check-ci-interpreters]
description = "Test the candidate commit on the driver and shim versions from the CI matrix"
run = "perl xt/bin/check-ci-interpreters"

[tasks.check-ci]
description = "Run the local pull request checks before pushing a commit"
run = '''
  set -eu
  candidate=$(git rev-parse --verify HEAD)
  check_checkout() {
    current=$(git rev-parse --verify HEAD)
    changes=$(git status --porcelain=v1 --untracked-files=all)
    if [ "$current" != "$candidate" ] || [ -n "$changes" ]; then
      echo "The local CI checks need a clean checkout of the same commit." >&2
      exit 1
    fi
  }
  check_checkout
  mise run check
  check_checkout
  mise run check-ci-interpreters
  check_checkout
'''

[tasks.coverage]
description = "Measure statement and branch coverage against the release floors"
run = "perl xt/bin/measure-coverage"

[tasks.realworld]
description = "Run the tool on real distributions inside a container and judge every record"
# Foreign tests and their mutants run arbitrary code.
# The container reads the repository and writes only to its scratch directory.
# Each program has 1 GiB of address space so a recursive mutant cannot evict the measurement and its reference tests.
run = [
  "docker build --quiet --file xt/realworld/Dockerfile --tag test-mutation-realworld .",
  "mkdir -p mutation-report",
  "docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 4096 --cpus 6 --memory 8g --tmpfs /work:exec,size=4g,uid=1000,gid=1000,mode=0755 --volume {{config_root}}:/repo:ro test-mutation-realworld prlimit --as=1073741824:1073741824 -- perl -I/opt/mutation/lib/perl5 /repo/xt/bin/realworld-observe > mutation-report/realworld.jsonl",
  "prove -l xt/realworld",
]

[tasks.dist]
description = "Pack the distribution archive"
run = ["perl Makefile.PL", "perl xt/bin/distribution-manifest", "make dist"]

[tasks.verify-install]
description = "Install the distribution archive in an empty prefix and confirm a repaired test gap"
run = "prove -lv xt/install"

[tasks.audit]
description = "Check the locked dependencies against the CPAN security advisories"
# Modules bundled with the interpreter follow the Perl that runs the tool, so the audit covers the locked distributions.
run = "cpan-audit --no-corelist deps ."

[tasks.secrets]
description = "Scan the tree for secrets"
run = "gitleaks dir --no-banner ."

[tasks.test-release-tools]
description = "Test release proposals, PAUSE uploads, and GitHub draft recovery"
tools = { node = "26.13.1", rust = "1.100.0" }
run = [
  '''
  set -eu
  dependencies=$(mktemp -d)
  trap 'rm -rf "$dependencies"' EXIT
  dependencies=$(cd "$dependencies" && pwd -P)
  cp xt/release-please/package.json xt/release-please/package-lock.json "$dependencies/"
  npm ci --ignore-scripts --no-audit --no-fund --prefix "$dependencies"
  NODE_PATH="$dependencies/node_modules" npm test --prefix xt/release-please
  ''',
  "python3 -I xt/release-publish/test_pause.py",
  "prove -l xt/release-publish",
]

[tasks.check-components]
description = "Run component tests, discovery, structural checks, and audits"
depends = [
  "test",
  "test-shim",
  "gate",
  "discover-fast",
  "audit",
  "secrets",
  "test-release-tools",
]

[tasks.check]
description = "Run every fast gate"
depends = ["check-components", "e2e"]
